name: Candidate Core formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/candidate-core' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          python-version: "3.13"
      - name: Sync Python workspace
        run: uv sync --locked --all-packages --dev
      - name: Format Python
        run: |
          uv run --package hirein-api ruff format services/api
          uv run --package hirein-api ruff check --fix services/api || true
      - name: Fix Svelte tuple inference
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/routes/+page.svelte')
          text = path.read_text()
          text = text.replace(
              "{#each [['REMOTE','Remoto'],['HYBRID','Híbrido'],['ONSITE','Presencial']] as option}",
              "{#each [{value:'REMOTE',label:'Remoto'},{value:'HYBRID',label:'Híbrido'},{value:'ONSITE',label:'Presencial'}] as option}"
          )
          text = text.replace("form.work_models.includes(option[0])", "form.work_models.includes(option.value)")
          text = text.replace("toggle(form.work_models, option[0])", "toggle(form.work_models, option.value)")
          text = text.replace("{option[1]}", "{option.label}")
          path.write_text(text)
          PY
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api apps/web/src/routes/+page.svelte
          if git diff --cached --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git commit -m "style: format Candidate Core implementation"
          git push origin HEAD:${{ github.head_ref }}
