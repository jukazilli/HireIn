name: Bootstrap lockfiles

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  lockfiles:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'bootstrap/phase-a' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          python-version: "3.13"
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve lockfiles
        run: |
          uv lock
          pnpm install --lockfile-only
      - name: Commit lockfiles to bootstrap branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date."
            exit 0
          fi
          git commit -m "chore: add reproducible dependency lockfiles"
          git push origin HEAD:${{ github.head_ref }}
