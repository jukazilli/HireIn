name: Regenerate contract v1.3 temp

on:
  push:
    branches: [feat/match-v1-3-evidence-qualifiers]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/match-v1-3-evidence-qualifiers
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          python-version: "3.13"
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --locked --all-packages --dev
      - run: pnpm install --frozen-lockfile
      - run: uv run --package hirein-api python scripts/export_openapi.py
      - run: pnpm generate:api-types
      - name: Commit generated schema if changed
        run: |
          if git diff --quiet -- packages/generated-client/src/schema.d.ts; then
            echo "Contract already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/generated-client/src/schema.d.ts
          git commit -m "chore: regenerate v1.3 API contract"
          git push origin HEAD:feat/match-v1-3-evidence-qualifiers
