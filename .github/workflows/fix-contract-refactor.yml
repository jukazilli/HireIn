name: Fix contract refactor

on:
  push:
    branches:
      - chore/contract-first-frontend

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/contract-first-frontend
      - name: Apply fix
        run: python scripts/fix_contract_refactor.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/routes/+page.svelte
          if git diff --cached --quiet; then
            echo "No fix needed."
            exit 0
          fi
          git commit -m "fix: preserve typed literals in profile UI"
          git push origin HEAD:chore/contract-first-frontend
