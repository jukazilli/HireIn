name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hirein
          POSTGRES_USER: hirein
          POSTGRES_PASSWORD: hirein
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hirein -d hirein"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hirein:hirein@localhost:5432/hirein
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          python-version: "3.13"
          enable-cache: true
      - name: Sync Python workspace
        run: uv sync --locked --all-packages --dev
      - name: Pilot runtime syntax
        run: |
          uv run python -m py_compile scripts/pilot_runtime.py
          uv run python scripts/pilot_runtime.py --help
      - name: Ruff
        run: uv run --package hirein-api ruff check services/api
      - name: Mypy
        run: uv run --package hirein-api mypy services/api/src
      - name: Tests
        run: uv run --package hirein-api pytest services/api/tests
      - name: Migration smoke test
        working-directory: services/api
        run: uv run --package hirein-api alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Svelte checks
        run: pnpm check:web
      - name: Build web
        run: pnpm build:web

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync Python workspace
        run: uv sync --locked --all-packages --dev
      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Export OpenAPI
        run: uv run --package hirein-api python scripts/export_openapi.py
      - name: Generate TypeScript contract
        run: pnpm generate:api-types
      - name: Upload generated contract
        uses: actions/upload-artifact@v4
        with:
          name: generated-api-contract
          path: packages/generated-client/src/schema.d.ts
      - name: Verify generated contract is committed
        run: git diff --exit-code -- packages/generated-client/src/schema.d.ts

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hirein
          POSTGRES_USER: hirein
          POSTGRES_PASSWORD: hirein
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hirein -d hirein"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hirein:hirein@localhost:5432/hirein
      CORS_ORIGINS: http://localhost:5173
      E2E_WEB_BASE_URL: http://localhost:5173
      E2E_PILOT_PASSWORD: hirein-e2e-password
      PILOT_ACCESS_PASSWORD: hirein-e2e-password
      PILOT_SESSION_TOKEN: hirein-e2e-session-token
      PILOT_BACKEND_TOKEN: hirein-e2e-backend-token
      HIREIN_BACKEND_TOKEN: hirein-e2e-backend-token
      HIREIN_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync Python workspace
        run: uv sync --locked --all-packages --dev
      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        working-directory: services/api
        run: uv run --package hirein-api alembic upgrade head
      - name: Install Playwright Chromium
        run: uvx --from playwright==1.55.0 playwright install --with-deps chromium
      - name: Start real API and web app
        run: |
          uv run --package hirein-api uvicorn hirein_api.main:app --host 0.0.0.0 --port 8000 > /tmp/hirein-api.log 2>&1 &
          echo $! > /tmp/hirein-api.pid
          pnpm --filter @hirein/web dev --host 0.0.0.0 --port 5173 > /tmp/hirein-web.log 2>&1 &
          echo $! > /tmp/hirein-web.pid
      - name: Wait for services
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8000/health/ready
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors http://localhost:5173/login
      - name: Confirm backend rejects unauthenticated pilot API
        run: |
          test "$(curl --silent --output /tmp/direct-api.txt --write-out '%{http_code}' http://localhost:8000/api/v1/jobs)" = "401"
      - name: Browser pilot smoke
        run: uv run --with playwright==1.55.0 python tests/e2e/pilot_smoke.py
      - name: Show server logs on failure
        if: failure()
        run: |
          echo "===== FastAPI ====="
          cat /tmp/hirein-api.log || true
          echo "===== Svelte/Vite ====="
          cat /tmp/hirein-web.log || true
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
      - name: Stop local services
        if: always()
        run: |
          kill "$(cat /tmp/hirein-api.pid)" 2>/dev/null || true
          kill "$(cat /tmp/hirein-web.pid)" 2>/dev/null || true
