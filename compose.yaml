services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hirein
      POSTGRES_USER: hirein
      POSTGRES_PASSWORD: hirein
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirein -d hirein"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hirein-postgres:/var/lib/postgresql/data

volumes:
  hirein-postgres:
